<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eau Cure - Water Delivery Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login Page -->
  <div id="loginPage" class="login-page" style="display: none;">
    <div class="login-container">
      <div class="login-card">
        <div style="text-align: center; margin-bottom: 40px;">
          <h1 style="font-size: 2.5em; margin: 0 0 10px 0;">💧 Eau Cure</h1>
          <p style="font-size: 1.1em; opacity: 0.95;">Water Delivery Tracker</p>
        </div>

        <form id="loginForm">
          <h2 style="text-align: center; border: none; padding: 0; margin-bottom: 30px; font-size: 1.5em;">Employee Login</h2>

          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter your username" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>

          <div id="loginError" style="display: none; color: #f44336; margin-top: 15px; text-align: center; font-weight: 600;"></div>
        </form>
      </div>
    </div>
  </div>

  <!-- Main App Page -->
  <div id="appPage" class="app-page" style="display: none;">
    <div class="container">
      <header style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h1>💧 Eau Cure</h1>
          <p>Water Station Delivery Tracker</p>
        </div>
        <div style="text-align: right;">
          <p style="margin: 0 0 10px 0; color: white;"><strong id="currentUser"></strong></p>
          <button id="logoutBtn" class="btn btn-secondary" style="padding: 8px 16px; font-size: 0.9em;">Logout</button>
        </div>
      </header>

      <main>
        <section class="form-section">
          <h2>Record New Delivery</h2>
          <form id="deliveryForm">
            <div class="form-group">
              <label for="company">Company Delivered</label>
              <input type="text" id="company" placeholder="Enter company name" required>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="bottlesDelivered">Bottles Delivered</label>
                <input type="number" id="bottlesDelivered" placeholder="0" min="0" required>
              </div>

              <div class="form-group">
                <label for="bottlesReturned">Bottles Returned</label>
                <input type="number" id="bottlesReturned" placeholder="0" min="0" required>
              </div>
            </div>

            <div class="form-group">
              <label for="drNumber">DR Number</label>
              <input type="text" id="drNumber" placeholder="Enter DR number" required>
            </div>

            <button type="submit" class="btn btn-primary">Add Delivery</button>
          </form>
        </section>

        <section class="table-section">
          <h2>Delivery Records</h2>
          <div class="table-wrapper">
            <table id="deliveriesTable">
              <thead>
                <tr>
                  <th>Company</th>
                  <th>Delivered</th>
                  <th>Returned</th>
                  <th>DR Number</th>
                  <th>Timestamp</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="tableBody">
                <tr class="empty-state">
                  <td colspan="6">No deliveries recorded yet</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Edit Delivery</h2>
      <form id="editForm">
        <input type="hidden" id="editId">

        <div class="form-group">
          <label for="editCompany">Company Delivered</label>
          <input type="text" id="editCompany" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="editBottlesDelivered">Bottles Delivered</label>
            <input type="number" id="editBottlesDelivered" min="0" required>
          </div>

          <div class="form-group">
            <label for="editBottlesReturned">Bottles Returned</label>
            <input type="number" id="editBottlesReturned" min="0" required>
          </div>
        </div>

        <div class="form-group">
          <label for="editDrNumber">DR Number</label>
          <input type="text" id="editDrNumber" required>
        </div>

        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
